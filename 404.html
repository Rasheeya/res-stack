<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - 404 Error</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-blue: #1d3557;
        }

        .error-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('assets/images/hero-bg.webp') center/cover;
            position: relative;
            overflow: hidden;
        }

        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(29, 53, 87, 0.85), rgba(29, 53, 87, 0.98));
            z-index: 1;
        }

        .error-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 700px;
            padding: 1.5rem;
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            line-height: 1;
            color: var(--primary-gold);
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        .error-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin-bottom: 1.5rem;
        }

        .error-text {
            font-family: 'Jost', sans-serif;
            font-size: 1.25rem;
            line-height: 1.8;
            opacity: 0.8;
            margin-bottom: 3.5rem;
            padding: 0 1rem;
        }

        .btn-gold {
            background-color: var(--primary-gold);
            border-color: var(--primary-gold);
            color: #111;
        }

        .btn-gold:hover {
            background-color: #d4b47a;
            border-color: #d4b47a;
            color: #000;
        }

        .btn-outline-gold {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .btn-outline-gold:hover {
            background-color: var(--primary-gold);
            color: #111;
        }

        .actions-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        @media (max-width: 576px) {
            .actions-container {
                flex-direction: column;
                padding: 0 2rem;
            }
            .error-text {
                font-size: 1.1rem;
                margin-bottom: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="error-page">
        <div class="error-overlay"></div>
        <div class="error-content" data-aos="fade-up" data-aos-duration="1000">
            <h1 class="error-code">404</h1>
            <h2 class="error-title fw-bold">Looks Like This Dish Is Off the Menu!</h2>
            <p class="error-text">We couldn't find the page you were looking for.<br class="d-none d-md-block"> It might have been devoured by one of our master chefs.</p>
            
            <div class="actions-container">
                <a href="index.html"
                    class="btn btn-gold btn-lg rounded-pill fw-bold px-4 py-3 shadow-lg d-inline-flex gap-2 align-items-center justify-content-center">
                    <i class="ph-bold ph-house-line"></i> Back to Homepage
                </a>
                <a href="javascript:history.back()"
                    class="btn btn-outline-gold btn-lg rounded-pill fw-bold px-4 py-3 shadow-lg d-inline-flex gap-2 align-items-center justify-content-center">
                    <i class="ph-bold ph-arrow-left"></i> Go Back
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>

</html>
